<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Map of automated-driving safety and security standards</title>
  <desc id="d">Each source of harm maps to a standard: E/E faults to ISO 26262, functional insufficiencies and foreseeable misuse to ISO 21448, ML-specific insufficiencies to ISO/PAS 8800, attacks to ISO/SAE 21434. ISO/TS 5083 and UL 4600 tie these together in an overall ADS safety argument; ISO 34502/34503 and SAE J3016 define scenarios, the ODD and automation levels; UN R155, R156, R157, EU 2022/1426 and the EU AI Act set regulatory requirements.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6673"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#101828" flood-opacity=".12"/></filter>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="20" fill="#ffffff"/>
  <text x="40" y="56" font-size="28" font-weight="700" fill="#17202a">Which standard covers which source of harm?</text>
  <text x="40" y="84" font-size="16" fill="#5b6673">Automated driving needs all of them together, and the safety case is where they meet.</text>

  <!-- Regulation band -->
  <rect x="40" y="108" width="1120" height="74" rx="14" fill="#eef1f5"/>
  <text x="60" y="134" font-size="13" font-weight="700" fill="#5b6673" letter-spacing="1.5">REGULATION AND TYPE APPROVAL</text>
  <g font-size="14" font-weight="600" fill="#17202a">
    <rect x="60" y="144" width="160" height="28" rx="14" fill="#fff" stroke="#d6dbe1"/><text x="140" y="163" text-anchor="middle">UN R155 · CSMS</text>
    <rect x="232" y="144" width="160" height="28" rx="14" fill="#fff" stroke="#d6dbe1"/><text x="312" y="163" text-anchor="middle">UN R156 · SUMS</text>
    <rect x="404" y="144" width="160" height="28" rx="14" fill="#fff" stroke="#d6dbe1"/><text x="484" y="163" text-anchor="middle">UN R157 · ALKS</text>
    <rect x="576" y="144" width="190" height="28" rx="14" fill="#fff" stroke="#d6dbe1"/><text x="671" y="163" text-anchor="middle">EU 2022/1426 · ADS</text>
    <rect x="778" y="144" width="190" height="28" rx="14" fill="#fff" stroke="#d6dbe1"/><text x="873" y="163" text-anchor="middle">EU AI Act 2024/1689</text>
    <rect x="980" y="144" width="160" height="28" rx="14" fill="#fff" stroke="#d6dbe1"/><text x="1060" y="163" text-anchor="middle">National AV laws</text>
  </g>

  <!-- Sources of harm -->
  <text x="40" y="222" font-size="13" font-weight="700" fill="#5b6673" letter-spacing="1.5">SOURCE OF HARM</text>
  <g font-size="15" fill="#17202a">
    <rect x="40" y="236" width="300" height="78" rx="12" fill="#fff" stroke="#d6dbe1" filter="url(#sh)"/>
    <text x="58" y="266" font-weight="700">Malfunctions</text><text x="58" y="290" fill="#5b6673" font-size="14">random hardware &amp; systematic faults</text>
    <rect x="40" y="330" width="300" height="78" rx="12" fill="#fff" stroke="#d6dbe1" filter="url(#sh)"/>
    <text x="58" y="360" font-weight="700">Functional insufficiencies</text><text x="58" y="384" fill="#5b6673" font-size="14">triggering conditions, foreseeable misuse</text>
    <rect x="40" y="424" width="300" height="78" rx="12" fill="#fff" stroke="#d6dbe1" filter="url(#sh)"/>
    <text x="58" y="454" font-weight="700">ML-specific insufficiencies</text><text x="58" y="478" fill="#5b6673" font-size="14">data, generalisation, uncertainty</text>
    <rect x="40" y="518" width="300" height="78" rx="12" fill="#fff" stroke="#d6dbe1" filter="url(#sh)"/>
    <text x="58" y="548" font-weight="700">Malicious attacks</text><text x="58" y="572" fill="#5b6673" font-size="14">remote, adjacent, local, physical</text>
  </g>

  <!-- Arrows -->
  <g stroke="#5b6673" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M340 275 H420"/><path d="M340 369 H420"/><path d="M340 463 H420"/><path d="M340 557 H420"/>
  </g>

  <!-- Product standards -->
  <text x="424" y="222" font-size="13" font-weight="700" fill="#5b6673" letter-spacing="1.5">ENGINEERING STANDARD</text>
  <g font-size="15">
    <rect x="424" y="236" width="330" height="78" rx="12" fill="#1f5fae"/>
    <text x="442" y="266" font-weight="700" fill="#fff" font-size="18">ISO 26262:2018</text><text x="442" y="290" fill="#dce8f7" font-size="14">Functional safety · HARA, ASIL, FMEDA, FTA</text>
    <rect x="424" y="330" width="330" height="78" rx="12" fill="#2a9d8f"/>
    <text x="442" y="360" font-weight="700" fill="#fff" font-size="18">ISO 21448:2022 (SOTIF)</text><text x="442" y="384" fill="#e0f4f1" font-size="14">Known/unknown scenarios, validation targets</text>
    <rect x="424" y="424" width="330" height="78" rx="12" fill="#7b5ea7"/>
    <text x="442" y="454" font-weight="700" fill="#fff" font-size="18">ISO/PAS 8800:2024</text><text x="442" y="478" fill="#ece5f6" font-size="14">AI safety lifecycle, data, AI assurance</text>
    <rect x="424" y="518" width="330" height="78" rx="12" fill="#c8553d"/>
    <text x="442" y="548" font-weight="700" fill="#fff" font-size="18">ISO/SAE 21434:2021</text><text x="442" y="572" fill="#fbe6e1" font-size="14">Cybersecurity engineering · TARA, CAL</text>
  </g>

  <!-- Integration -->
  <g stroke="#5b6673" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M754 275 C800 275 800 380 838 395"/><path d="M754 369 C795 369 800 400 838 405"/>
    <path d="M754 463 C795 463 800 430 838 425"/><path d="M754 557 C800 557 800 450 838 437"/>
  </g>
  <text x="842" y="222" font-size="13" font-weight="700" fill="#5b6673" letter-spacing="1.5">OVERALL ADS ARGUMENT</text>
  <rect x="842" y="330" width="318" height="140" rx="14" fill="#17202a"/>
  <text x="862" y="364" font-weight="700" fill="#fff" font-size="19">Safety case</text>
  <text x="862" y="392" fill="#c9d3dd" font-size="14">ISO/TS 5083:2025 · ADS safety</text>
  <text x="862" y="414" fill="#c9d3dd" font-size="14">UL 4600 (3rd ed.) · autonomy safety case</text>
  <text x="862" y="436" fill="#c9d3dd" font-size="14">GSN · claims, arguments, evidence</text>
  <text x="862" y="458" fill="#c9d3dd" font-size="14">SPIs · field monitoring</text>

  <!-- Foundations -->
  <rect x="40" y="628" width="1120" height="96" rx="14" fill="#eef1f5"/>
  <text x="60" y="656" font-size="13" font-weight="700" fill="#5b6673" letter-spacing="1.5">SHARED FOUNDATIONS</text>
  <g font-size="14" font-weight="600" fill="#17202a">
    <rect x="60" y="670" width="230" height="36" rx="18" fill="#fff" stroke="#d6dbe1"/><text x="175" y="693" text-anchor="middle">SAE J3016 · automation levels</text>
    <rect x="300" y="670" width="260" height="36" rx="18" fill="#fff" stroke="#d6dbe1"/><text x="430" y="693" text-anchor="middle">ISO 34503:2023 · ODD taxonomy</text>
    <rect x="570" y="670" width="320" height="36" rx="18" fill="#fff" stroke="#d6dbe1"/><text x="730" y="693" text-anchor="middle">ISO 34502:2022 · scenario-based evaluation</text>
    <rect x="900" y="670" width="240" height="36" rx="18" fill="#fff" stroke="#d6dbe1"/><text x="1020" y="693" text-anchor="middle">ISO 24089:2023 · software update</text>
  </g>
</svg>
