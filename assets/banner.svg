<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="bt bd" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="bt">Autonomous Driving: AI Safety and Security</title>
  <desc id="bd">An open course in eight modules (50 notebooks, real data) along a road: perception, failures and robustness, functional safety, SOTIF, cybersecurity, AI safety, runtime assurance, and standards, regulation and safety case.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b3a5c"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a9d8f"/><stop offset=".5" stop-color="#6aa7f0"/><stop offset="1" stop-color="#e9c46a"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="22" fill="url(#bg)"/>
  <g opacity=".08" stroke="#fff">
    <path d="M0 110 H1280 M0 220 H1280 M0 330 H1280"/><path d="M160 0 V440 M320 0 V440 M480 0 V440 M640 0 V440 M800 0 V440 M960 0 V440 M1120 0 V440"/>
  </g>
  <text x="56" y="92" fill="#9fc3ea" font-size="16" font-weight="700" letter-spacing="3">OPEN COURSE · 50 NOTEBOOKS · REAL DATA · RUNS IN YOUR BROWSER</text>
  <text x="56" y="146" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-.5">Autonomous Driving</text>
  <text x="56" y="200" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-.5">AI Safety &amp; Security</text>
  <text x="58" y="240" fill="#c9d6e3" font-size="19">From sensors to safety cases: ISO 26262 · ISO 21448 · ISO/SAE 21434 · ISO/PAS 8800</text>

  <path id="r" d="M70 360 C 260 300, 380 400, 560 350 S 860 290, 1010 330 S 1180 360, 1230 300" fill="none" stroke="url(#road)" stroke-width="10" stroke-linecap="round"/>
  <path d="M70 360 C 260 300, 380 400, 560 350 S 860 290, 1010 330 S 1180 360, 1230 300" fill="none" stroke="#0d1b2a" stroke-width="2" stroke-dasharray="14 12" opacity=".7"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <g transform="translate(110 346)"><circle r="17" fill="#fff"/><text y="5" fill="#0d1b2a">01</text><text y="-26" fill="#e6eef6" font-weight="600">Perceive &amp; predict</text></g>
    <g transform="translate(260 330)"><circle r="17" fill="#fff"/><text y="5" fill="#0d1b2a">02</text><text y="40" fill="#e6eef6" font-weight="600">Fail</text></g>
    <g transform="translate(400 366)"><circle r="17" fill="#fff"/><text y="5" fill="#0d1b2a">03</text><text y="-26" fill="#e6eef6" font-weight="600">ISO 26262</text></g>
    <g transform="translate(540 353)"><circle r="17" fill="#fff"/><text y="5" fill="#0d1b2a">04</text><text y="40" fill="#e6eef6" font-weight="600">SOTIF</text></g>
    <g transform="translate(690 326)"><circle r="17" fill="#fff"/><text y="5" fill="#0d1b2a">05</text><text y="-26" fill="#e6eef6" font-weight="600">Cyber</text></g>
    <g transform="translate(850 312)"><circle r="17" fill="#fff"/><text y="5" fill="#0d1b2a">06</text><text y="40" fill="#e6eef6" font-weight="600">AI safety</text></g>
    <g transform="translate(1010 330)"><circle r="17" fill="#fff"/><text y="5" fill="#0d1b2a">07</text><text y="-26" fill="#e6eef6" font-weight="600">Runtime</text></g>
    <g transform="translate(1180 334)"><circle r="17" fill="#e9c46a"/><text y="5" fill="#0d1b2a">08</text><text y="40" fill="#e6eef6" font-weight="600">Safety case</text></g>
  </g>
  <g transform="translate(1040 70)" opacity=".95">
