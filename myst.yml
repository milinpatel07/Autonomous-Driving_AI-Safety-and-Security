# Jupyter Book 2 / MyST configuration for the course website.
# Build locally:  pip install "jupyter-book>=2" && jupyter book start   (or: jupyter book build --html)
# Deployed by .github/workflows/site.yml to GitHub Pages.
version: 1
project:
  title: "Autonomous Driving: AI Safety and Security"
  description: "An open course on perception, functional safety (ISO 26262), SOTIF (ISO 21448), cybersecurity (ISO/SAE 21434) and AI safety (ISO/PAS 8800) for automated vehicles — 40 runnable notebooks, templates, tools and a tested toolkit."
  keywords: [autonomous driving, functional safety, ISO 26262, SOTIF, ISO 21448, ISO/SAE 21434, ISO/PAS 8800, UL 4600, uncertainty, safety case]
  authors:
    - name: Milin Patel
      affiliations: [Hochschule Kempten – University of Applied Sciences]
  github: https://github.com/milinpatel07/Autonomous-Driving_AI-Safety-and-Security
  license: MIT
  exclude:
    - "_build/**"
    - "tests/**"
    - "avsafety/**"
    - "NEXT_STEPS.md"
