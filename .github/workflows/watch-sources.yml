name: Source watch

# Monthly: detect new editions and amendments of the standards and regulations the course cites, and new
# releases of the datasets it downloads. Opens (or updates) one issue labelled "source-watch" when a
# fingerprint in references/fingerprints.json no longer matches. Unreachable sources go to the job summary.

on:
  schedule:
    - cron: "23 4 3 * *"      # 04:23 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "pyyaml>=6"
      - name: Fetch sources and compare fingerprints
        id: watch
        run: |
          python scripts/watch_sources.py --report report.md --issue issue.md \
            --write-new fingerprints.new.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the new fingerprints for review
        uses: actions/upload-artifact@v4
        with:
          name: fingerprints-${{ github.run_id }}
          path: |
            fingerprints.new.json
            report.md
          retention-days: 90
      - name: Open or update the source-watch issue
        if: steps.watch.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = 'source-watch';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync('issue.md', 'utf8') +
              `\nNew fingerprints: artifact \`fingerprints-${context.runId}\` of [this run](${runUrl}).\n`;
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'c5def5',
                description: 'A cited standard, regulation or dataset changed' });
            } catch (e) { if (e.status !== 422) throw e; }   // 422: label exists
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', labels: label, per_page: 100 });
            if (open.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, body });
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number,
                body: `Updated by the source watch of ${new Date().toISOString().slice(0, 10)} ([run](${runUrl})).` });
            } else {
              await github.rest.issues.create({ ...context.repo, labels: [label], body,
                title: 'Source watch: a cited standard, regulation or dataset changed' });
            }
