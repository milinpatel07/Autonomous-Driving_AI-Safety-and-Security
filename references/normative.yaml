# Normative and regulatory references of the course.
#
# One entry per clause, paragraph, table, annex or article that a notebook, template or site page cites.
# scripts/check_references.py maps every citation in the course to an entry here and fails when the same
# fact is cited with two different paragraph numbers. Verification methods:
#   official-text     checked against the published text (regulation PDF, Official Journal, statute)
#   official-summary  checked against an official table of contents, abstract, catalogue or data dictionary
#                     (the full text is paywalled or could not be retrieved)
#   secondary         checked against a named secondary source only
#   unverified        not yet checked; the checker reports these entries
# `used_in` is computed (python scripts/check_references.py --update-used-in); do not edit it by hand.
# `watch` tells scripts/watch_sources.py how to detect a new edition, amendment or data release.
schema: 1

documents:
  # ---------------------------------------------------------------- UN Regulations (1958 Agreement)
  UNR157:
    short: UN R157
    title: UN Regulation No. 157 — Automated Lane Keeping Systems (ALKS)
    edition: >-
      01 series of amendments, E/ECE/TRANS/505/Rev.3/Add.156/Amend.4 (3 March 2023; authentic text
      ECE/TRANS/WP.29/2022/59/Rev.1; in force 4 January 2023)
    url: https://unece.org/transport/vehicle-regulations-wp29/standards/addenda-1958-agreement-regulations-141-160
    verification:
      method: official-text
      checked: "2026-10-29"
      note: >-
        Paragraph numbers checked in the UNECE documentation copy of Amend.4 mirrored at
        https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf, and compared with the original text
        (Supplement 1, Amend.1, https://www.marklines.com/statics/unece/pdf_202207/R157am1e_0.pdf). Later
        documentation versions exist (Amendment 5, Revision 1 and Revision 1/Amendments 1-2 per
        globalautoregs.com, as of October 2026); the UNECE PDFs of those returned HTTP 403 to automated
        clients and were not compared.
    watch:
      - {method: regex-page, url: "https://unece.org/transport/vehicle-regulations-wp29/standards/addenda-1958-agreement-regulations-141-160", pattern: 'R157[^"<>]{0,40}\.pdf'}
      - {method: regex-page, url: "https://globalautoregs.com/rules/247/texts", pattern: '>\s*((?:Revision \d+(?: \| Amendment \d+)?)|Amendment \d+)\s*<'}
      - {method: regex-page, url: "https://globalautoregs.com/rules/247/modifications", pattern: '>\s*((?:Original text|\d{2} series of amendments|Supplement \d+[^<]{0,40}))\s*<'}
  UNR155:
    short: UN R155
    title: UN Regulation No. 155 — Cyber security and cyber security management system
    edition: Original version, entry into force 22 January 2021 (OJ L 82, 9.3.2021, published as [2021/387])
    url: https://eur-lex.europa.eu/eli/reg/2021/387/oj
    verification:
      method: official-text
      checked: "2026-10-29"
      note: >-
        Text read from the Official Journal publication through the EU Publications Office (CELEX 42021X0387).
        A 2024 supplement extended the scope to L-category vehicles; it does not change the paragraphs cited.
    watch:
      - {method: regex-page, url: "https://unece.org/transport/vehicle-regulations-wp29/standards/addenda-1958-agreement-regulations-141-160", pattern: 'R155[^"<>]{0,40}\.pdf'}
      - {method: regex-page, url: "https://globalautoregs.com/rules/226/modifications", pattern: '>\s*((?:Original text|\d{2} series of amendments|Supplement \d+[^<]{0,40}))\s*<'}
  UNR156:
    short: UN R156
    title: UN Regulation No. 156 — Software update and software update management system
    edition: >-
      Original version, entry into force 22 January 2021 (OJ L 82, 9.3.2021, [2021/388]); a 01 series of
      amendments has since been adopted (globalautoregs.com, as of October 2026)
    url: https://eur-lex.europa.eu/eli/reg/2021/388/oj
    verification:
      method: official-text
      checked: "2026-10-29"
      note: Title and OJ reference read through the EU Publications Office (CELEX 42021X0388). The course cites it only as a whole.
    locators: none
    watch:
      - {method: regex-page, url: "https://globalautoregs.com/rules/235/modifications", pattern: '>\s*((?:Original text|\d{2} series of amendments|Supplement \d+[^<]{0,40}))\s*<'}

