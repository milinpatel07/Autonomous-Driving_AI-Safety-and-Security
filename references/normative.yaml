entries:
  # ================================================================ UN R157 (01 series, Amend.4)
  - id: r157-def-transition-demand
    doc: UNR157
    locator: "2.2"
    states: Definition of the transition demand (request from the system to the driver to take back the DDT).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-01]
  - id: r157-def-mrm
    doc: UNR157
    locator: "2.7"
    states: Definition of the minimum risk manoeuvre, quoted verbatim.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-01]
  - id: r157-def-max-operational-speed
    doc: UNR157
    locator: "2.9.2"
    states: The maximum operational speed is selected by the system "under current environmental and sensor conditions".
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-01]
  - id: r157-misuse
    doc: UNR157
    locator: "5.1.8"
    states: The manufacturer takes measures against reasonably foreseeable misuse by the driver and tampering.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-speed-130
    doc: UNR157
    locator: "5.2.3.1"
    states: Operation up to 130 km/h; a specified maximum speed above 60 km/h only with MRM lane-change capability (01 series).
    fact: 'MRM lane[- ]change'
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29", note: "The original text (Amend.1) limited 5.2.3.1 to 60 km/h."}
    used_in: [07-01]
  - id: r157-transition-demand
    doc: UNR157
    locator: "5.4"
    states: Transition demand and system operation during the transition phase (heading).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-planned-event
    doc: UNR157
    locator: "5.4.2.1"
    states: For a planned event, the transition demand comes early enough that an MRM would stop the vehicle before the event.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-01, 07-03]
  - id: r157-no-lane-change-in-transition
    doc: UNR157
    locator: "5.4.2.4"
    states: A regular lane change is not started when a transition demand is known to occur during it.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05]
  - id: r157-transition-phase
    doc: UNR157
    locator: "5.4.3"
    states: The system keeps operating during the transition phase and may reduce speed.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-escalation-4s
    doc: UNR157
    locator: "5.4.3.2"
    fact_locators: ["6.4.1"]
    states: The transition demand is escalated at the latest 4 s after it starts (with a haptic warning, 6.4.1(c)).
    fact: '\b4(?:\.0)?\s?s\b'
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-01, 07-03]
  - id: r157-mrm-earliest-10s
    doc: UNR157
    locator: "5.4.4.1"
    states: Without driver response an MRM starts at the earliest 10 s after the start of the transition demand.
    fact: '\b10(?:\.0)?\s?s\b'
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-01, 07-03]
  - id: r157-mrm-immediate
    doc: UNR157
    locator: "5.4.4.1.1"
    states: An MRM may start immediately in case of a severe ALKS or vehicle failure.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-01]
  - id: r157-mrm
    doc: UNR157
    locator: "5.5"
    states: Minimum risk manoeuvre (heading); ends in standstill with hazard lights.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-01, 07-03]
  - id: r157-mrm-standstill
    doc: UNR157
    locator: "5.5.1"
    states: The MRM brings the vehicle to standstill in a target stop area, unless the driver deactivates the system (01 series).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29", note: "In the original text 5.5.1 held the deceleration limit and 5.5.2 the standstill; the 01 series swapped them."}
    used_in: []
  - id: r157-mrm-deceleration
    doc: UNR157
    locator: "5.5.2"
    superseded_locators: ["5.5.1"]
    states: During the MRM the vehicle is slowed down aiming at a deceleration demand not greater than 4.0 m/s²; hazard lights at the start of the MRM.
    fact: '\b4(?:\.0)?\s?m/s(?:²|\^2|2\b)'
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29", note: "Paragraph 5.5.1 in the original text (Amend.1); 5.5.2 in the 01 series that the course cites."}
    used_in: [03-05, 07-01, 07-03]
  - id: r157-mrm-termination
    doc: UNR157
    locator: "5.5.3"
    states: An MRM ends only when the system is deactivated or the vehicle is at standstill.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-01]
  - id: r157-reactivation
    doc: UNR157
    locator: "5.5.5"
    states: Reactivation after an MRM only after a new engine start/run cycle.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-03]
  - id: r157-driver-availability-system
    doc: UNR157
    locator: "6.1"
    states: Driver availability recognition system (presence, belt, availability).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-driver-presence
    doc: UNR157
    locator: "6.1.2"
    states: A transition demand starts if the driver is out of the seat for more than 1 s or the belt is unbuckled.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-03]
  - id: r157-driver-availability
    doc: UNR157
    locator: "6.1.3"
    states: The system detects whether the driver is available to respond to a transition demand.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-03]
  - id: r157-availability-criteria
    doc: UNR157
    locator: "6.1.3.1"
    states: At least two availability criteria within the last 30 s; otherwise a warning and a transition demand at the latest after 15 s; documented justification.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-other-activities
    doc: UNR157
    locator: "6.1.4"
    states: Other activities on on-board displays are suspended at a transition demand or deactivation.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-03]
  - id: r157-activation
    doc: UNR157
    locator: "6.2"
    states: Activation, deactivation and driver input (heading).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-activation-conditions
    doc: UNR157
    locator: "6.2.3"
    states: Activation only on deliberate driver action when all listed conditions hold, incl. (g) roads where pedestrians and cyclists are prohibited.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-03]
  - id: r157-manual-deactivation
    doc: UNR157
    locator: "6.2.4"
    states: Deliberate deactivation, protected against unintentional action, with the driver in lateral control.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05]
  - id: r157-deactivation-during-td
    doc: UNR157
    locator: "6.2.5.2"
    states: During a transition demand or MRM, deactivation by taking the steering control only if the driver is attentive (6.3.1.1).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-03]
  - id: r157-deactivation-during-em
    doc: UNR157
    locator: "6.2.5.3"
    states: Deactivation during an emergency manoeuvre may be delayed until the collision risk has disappeared.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05]
  - id: r157-no-automatic-fallback
    doc: UNR157
    locator: "6.2.6"
    states: No automatic transition to a function providing continuous longitudinal/lateral control after deactivation; AEBS, ESC, BAS, ESF are not deactivated with the ALKS.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-override
    doc: UNR157
    locator: "6.3"
    states: System override (heading).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-attentiveness
    doc: UNR157
    locator: "6.3.1.1"
    states: Driver attentiveness criteria (gaze on road or mirrors, head movement towards the driving task).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-information
    doc: UNR157
    locator: "6.4"
    states: Information to the driver (heading).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-td-signals
    doc: UNR157
    locator: "6.4.1"
    states: Transition demand by optical plus acoustic and/or haptic signal; at the latest after 4 s a haptic warning and escalation (6.4.1(c)).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-01, 07-03]
  - id: r157-deactivation-signal
    doc: UNR157
    locator: "6.4.2.3"
    states: Deactivation is indicated optically, plus an acoustic signal unless it follows a transition demand that had one.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05]
  - id: r157-dssad
    doc: UNR157
    locator: "8"
    states: Data Storage System for Automated Driving (DSSAD).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-06]
  - id: r157-annex3
    doc: UNR157
    locator: Annex 3
    states: Guidance on traffic disturbance critical scenarios (cut-in, cut-out, deceleration) with human-driver performance models.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [04-05]
  - id: r157-annex4
    doc: UNR157
    locator: Annex 4
    states: Special requirements for the safety aspects of electronic control systems and audit (safety concept, field monitoring).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [02-01, 03-05, 07-01, 07-03, 07-05, 07-06, 08-02]
  - id: r157-annex4-safety-approach
    doc: UNR157
    locator: Annex 4 3.4.4
    states: The safety approach "may be based on" FMEA, FTA and STPA "or any similar process" (b); the inspection covers items (i)–(viii), incl. foreseeable misuse (vi) and cyber-attacks (viii).
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [03-05, 07-03]
  - id: r157-annex4-field-monitoring
    doc: UNR157
    locator: Annex 4 3.5.4
    states: Processes to monitor safety-relevant incidents caused by the engaged ALKS and to report critical incidents.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
    used_in: [07-05]
  - id: r157-annex5
    doc: UNR157
    locator: Annex 5
    states: Test specifications for ALKS.
    source: https://www.marklines.com/statics/unece/pdf_202311/R157am4e.pdf
    verification: {method: official-text, checked: "2026-10-29"}
